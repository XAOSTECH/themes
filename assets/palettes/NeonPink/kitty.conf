# NeonPink — kitty colour theme
# Sample palette for the themes cycler (tuiGen output format).
# Regenerate with:
#   tuiGen --target kitty --preset neonpink -o /path/to/themes/assets/palettes
#
# kitty applies this via the cycler's current-theme.conf symlink; add once to
# kitty.conf:  include current-theme.conf

foreground #ffbcde
background #26002f
cursor     #ff69b4
selection_foreground #26002f
selection_background #ff80bd

color0  #110015
color1  #69ffb4
color2  #00ffd9
color3  #a6ff00
color4  #ff6969
color5  #ff69b4
color6  #b4ff69
color7  #ffbcde
color8  #500061
color9  #9cffce
color10 #33ffe0
color11 #b8ff33
color12 #ff9c9c
color13 #ff9cce
color14 #ceff9c
color15 #ffeff7
