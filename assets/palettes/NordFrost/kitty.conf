# NordFrost — kitty colour theme
# Sample palette for the themes cycler (tuiGen output format).
# Regenerate with:
#   tuiGen --target kitty --preset nord -o /path/to/themes/assets/palettes
#
# kitty applies this via the cycler's current-theme.conf symlink; add once to
# kitty.conf:  include current-theme.conf

foreground #d8dee9
background #2e3440
cursor     #d8dee9
selection_foreground #2e3440
selection_background #434c5e

color0  #3b4252
color1  #bf616a
color2  #a3be8c
color3  #ebcb8b
color4  #81a1c1
color5  #b48ead
color6  #88c0d0
color7  #e5e9f0
color8  #4c566a
color9  #bf616a
color10 #a3be8c
color11 #ebcb8b
color12 #81a1c1
color13 #b48ead
color14 #8fbcbb
color15 #eceff4
