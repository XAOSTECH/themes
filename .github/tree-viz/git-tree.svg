<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="820" 
     viewBox="0 0 1200 820">
  <defs>
    <radialGradient id="leafGradient">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:0.8" />
    </radialGradient>
    <radialGradient id="mergeGradient">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.8" />
    </radialGradient>
    <radialGradient id="forkGradient">
      <stop offset="0%" style="stop-color:#fb923c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:0.8" />
    </radialGradient>
    <radialGradient id="tagGradient">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:0.8" />
    </radialGradient>
    <style>
      .branch-line { stroke: #64748b; stroke-width: 2; fill: none; opacity: 0.7; }
      .trunk-line { stroke: #22c55e; stroke-width: 2.5; fill: none; opacity: 0.6; }
      .commit-leaf { cursor: pointer; }
      .commit-leaf:hover { filter: brightness(1.5); }
      .branch-label { font-family: sans-serif; font-size: 12px; font-weight: bold; fill: #0f172a; }
    </style>
  </defs>
  
  <rect width="1200" height="820" fill="#f8fafc"/>
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#e2e8f0" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1200" height="820" fill="url(#grid)"/>
  
  <!-- Branch connection lines -->
  <g id="branches">
    <line class="trunk-line" x1="600" y1="60" x2="600" y2="100"/>
    <line class="trunk-line" x1="600" y1="100" x2="600" y2="140"/>
    <line class="trunk-line" x1="600" y1="140" x2="600" y2="260"/>
    <path class="branch-line" d="M 600 140 C 600 156, 720 164, 720 180"/>
    <path class="branch-line" d="M 720 180 C 720 212, 600 228, 600 260"/>
    <line class="trunk-line" x1="600" y1="260" x2="600" y2="300"/>
    <line class="trunk-line" x1="600" y1="300" x2="600" y2="340"/>
    <line class="trunk-line" x1="600" y1="340" x2="600" y2="380"/>
    <line class="trunk-line" x1="600" y1="380" x2="600" y2="420"/>
    <line class="trunk-line" x1="600" y1="420" x2="600" y2="540"/>
    <path class="branch-line" d="M 600 420 C 600 436, 480 444, 480 460"/>
    <path class="branch-line" d="M 480 460 C 480 492, 600 508, 600 540"/>
    <line class="trunk-line" x1="600" y1="540" x2="600" y2="580"/>
    <line class="trunk-line" x1="600" y1="580" x2="600" y2="620"/>
    <line class="trunk-line" x1="600" y1="620" x2="600" y2="660"/>
    <line class="trunk-line" x1="600" y1="660" x2="600" y2="700"/>
  </g>
  <!-- Commit nodes -->
  <g id="commits">
    <circle class="commit-leaf" cx="600" cy="60" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>f590e78: chore: update git tree visualisation</title></circle>
    <circle class="commit-leaf" cx="600" cy="100" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>2c61c9d: chore: update git tree visualisation</title></circle>
    <circle class="commit-leaf" cx="600" cy="140" r="10" fill="url(#mergeGradient)" stroke="#7c3aed" stroke-width="1.5"><title>1bdb43a: Merge pull request #2 from XAOSTECH:anglicise/20260401-021042</title></circle>
    <circle class="commit-leaf" cx="720" cy="180" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>79c842f: chore: convert American spellings to British English</title></circle>
    <circle class="commit-leaf" cx="600" cy="260" r="9" fill="url(#forkGradient)" stroke="#ea580c" stroke-width="1.5"><title>bd98d5e: chore: update CHANGELOG for v0.1.0</title></circle>
    <circle class="commit-leaf" cx="600" cy="300" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>4e388a4: chore(dc-init): load workflows,actions</title></circle>
    <circle class="commit-leaf" cx="600" cy="340" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>1f4fb23: chore(dc-init): update workflows + action</title></circle>
    <circle class="commit-leaf" cx="600" cy="380" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>84a4f91: docs: complete README template</title></circle>
    <circle class="commit-leaf" cx="600" cy="420" r="10" fill="url(#mergeGradient)" stroke="#7c3aed" stroke-width="1.5"><title>68f6c87: Merge pull request #1 from XAOSTECH:anglicise/20260301-015818\n\nchore: Convert American spellings to British English</title></circle>
    <circle class="commit-leaf" cx="480" cy="460" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>73c6099: chore: convert American spellings to British English</title></circle>
    <circle class="commit-leaf" cx="600" cy="540" r="9" fill="url(#forkGradient)" stroke="#ea580c" stroke-width="1.5"><title>3aef13b: chore: update CHANGELOG for v0.0.1</title></circle>
    <circle class="commit-leaf" cx="600" cy="580" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>abf9620: chore(readme/dir): add GTK referral + move GTK Themes</title></circle>
    <circle class="commit-leaf" cx="600" cy="620" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>d26bde5: dc-init</title></circle>
    <circle class="commit-leaf" cx="600" cy="660" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>d9f5174: Redesign with soft off-pink pastels: use pastel-generated colors, increase transparency, add comprehensive GNOME component styling</title></circle>
    <circle class="commit-leaf" cx="600" cy="700" r="6" fill="url(#leafGradient)" stroke="#16a34a" stroke-width="1.5"><title>12bdeb6: init</title></circle>
  </g>
  
  <!-- Legend -->
  <g id="legend" transform="translate(20, 20)">
    <rect width="200" height="110" fill="white" stroke="#cbd5e1" stroke-width="1" rx="4"/>
    <circle cx="20" cy="25" r="5" fill="url(#leafGradient)" stroke="#16a34a"/>
    <text x="32" y="30" class="branch-label" font-size="12">Regular Commit</text>
    <circle cx="20" cy="50" r="6" fill="url(#mergeGradient)" stroke="#7c3aed"/>
    <text x="32" y="55" class="branch-label" font-size="12">Merge Commit</text>
    <circle cx="20" cy="75" r="6" fill="url(#forkGradient)" stroke="#ea580c"/>
    <text x="32" y="80" class="branch-label" font-size="12">Fork Point</text>
    <circle cx="20" cy="100" r="6" fill="url(#tagGradient)" stroke="#0284c7"/>
    <text x="32" y="105" class="branch-label" font-size="12">Tagged</text>
  </g>
  
  <!-- Repository info -->
  <g id="info" transform="translate(20, 780)">
    <text x="0" y="0" class="branch-label" font-size="12" fill="#666">
      Repository: themes
    </text>
    <text x="0" y="20" class="branch-label" font-size="10" fill="#999">
      Generated: 2026-04-20 01:26:52 UTC
    </text>
  </g>
</svg>
